run:
  timeout: 5m
  modules-download-mode: readonly

output:
  sort-results: true

issues:
  exclude-use-default: false
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - dupl
    - path: internal/handler
      text: "exported function"
      linters:
        - revive

linters:
  enable:
    - gofmt
    - goimports
    - golint
    - govet
    - errcheck
    - ineffassign
    - misspell
    - unconvert
    - goconst
    - gosec
    - gocyclo
    - gocritic
    - revive
    - staticcheck
    - typecheck
    - unused
    - varcheck
    - structcheck
    - deadcode

linters-settings:
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
