Name: gochat
Host: 0.0.0.0
Port: 8888
MachineNode: 1

Cookie:
  Domain: ${COOKIE_DOMAIN}
  Secure: ${COOKIE_SECURE}
  HttpOnly: ${COOKIE_HTTPONLY}
  Path: ${COOKIE_PATH}

CORS:
  AllowOrigins: ${CORS_ORIGINS}
  AllowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  AllowHeaders:
    - Origin
    - Content-Type
    - Authorization
  ExposeHeaders:
    - Content-Length
    - Content-Type
  AllowCredentials: true
  MaxAge: 72h

RefreshToken:
  Length: 32

AccessToken:
  Secret: ${JWT_SECRET}
  ValidityDuration: 1h

RateLimit:
  Period: 1s
  Limit: 10

Mysql:
  Host: ${DB_HOST}
  Port: ${DB_PORT}
  Username: ${DB_USERNAME}
  Password: ${DB_PASSWORD}
  Database: ${DB_NAME}

Redis:
  User: ${REDIS_USER}
  Host: ${REDIS_HOST}
  Port: ${REDIS_PORT}
  Password: ${REDIS_PASSWORD}
  Database: ${REDIS_DB}

Logger:
  Mode: debug
  Level: info
  Filename: logs/app.log
  MaxSize: 100    # MB
  MaxAge: 7       # days
  MaxBackups: 3

Hasher:
  Cost: 10

Email:
  Host: ${EMAIL_HOST}
  Port: ${EMAIL_PORT}
  Username: ${EMAIL_USERNAME}
  Password: ${EMAIL_PASSWORD}

BinlogReader:
  Addr: ${BINLOG_ADDR}
  User: ${BINLOG_USER}
  Password: ${BINLOG_PASSWORD}
  TableDB: ${BINLOG_TABLEDB}

Kafka:
  Common:
    BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
    ClientID: ${KAFKA_CLIENT_ID}
    SecurityProtocol: ${KAFKA_SECURITY_PROTOCOL}       # plaintext|ssl|sasl_plaintext|sasl_ssl
    SASLMechanism: ${KAFKA_SASL_MECHANISM}             # 可为空；PLAIN|SCRAM-SHA-256|SCRAM-SHA-512
    SASLUsername: ${KAFKA_SASL_USERNAME}
    SASLPassword: ${KAFKA_SASL_PASSWORD}

  Producer:
    Acks: ${KAFKA_ACKS}                                 # all|-1|0|1
    EnableIdempotence: ${KAFKA_ENABLE_IDEMPOTENCE}
    MessageTimeoutMs: ${KAFKA_MESSAGE_TIMEOUT_MS}
    AllowAutoCreateTopics: ${KAFKA_ALLOW_AUTO_CREATE_TOPICS}
    MaxInFlight: ${KAFKA_MAX_IN_FLIGHT}
    MaxRetries: ${KAFKA_MAX_RETRIES}
    BackoffMs: ${KAFKA_BACKOFF_MS}

  Consumer:
    GroupID: ${KAFKA_GROUP_ID}
    AutoOffsetReset: ${KAFKA_AUTO_OFFSET_RESET}         # earliest|latest
    EnableAutoCommit: ${KAFKA_ENABLE_AUTO_COMMIT}
    AutoCommitIntervalMs: ${KAFKA_AUTO_COMMIT_INTERVAL_MS}
    SessionTimeoutMs: ${KAFKA_SESSION_TIMEOUT_MS}
    MaxPollIntervalMs: ${KAFKA_MAX_POLL_INTERVAL_MS}