# Base defaults. Override via config.local.yaml or config.override.yaml (gitignored), and env vars for sensitive values.
# Base file keeps literal defaults and does NOT expand env vars.
Name: gochat
Env: debug
Host: 0.0.0.0
Port: 8080
MachineNode: 1
Timeout: 10s
DisableSessionStartedEvent: false

Cookie:
  Domain: ""
  Secure: false
  HttpOnly: true
  Path: /

CORS:
  AllowOrigins:
    - "*"
  AllowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  AllowHeaders:
    - Origin
    - Content-Type
    - Authorization
  ExposeHeaders:
    - Content-Length
    - Content-Type
  AllowCredentials: true
  MaxAge: 72h

RefreshToken:
  Length: 32

AccessToken:
  Secret: "dev-secret-change-me"
  ValidityDuration: 1h

RateLimit:
  Period: 1s
  Limit: 10

Mysql:
  Host: 127.0.0.1
  Port: 3306
  Username: root
  Password: ""
  Database: gochat
  SlowThresholdMillis: 200
  MaxOpenConns: 200
  MaxIdleConns: 100
  ConnMaxLifetimeSec: 600
  ConnMaxIdleTimeSec: 120

Redis:
  User: ""
  Host: 127.0.0.1
  Port: 6379
  Password: ""
  Database: 0

Logger:
  Mode: debug
  Level: info
  Filename: logs/app.log
  MaxSize: 100
  MaxAge: 7
  MaxBackups: 3

Hasher:
  Cost: 10

Email:
  Host: smtp.example.com
  Port: 587
  Username: noreply@example.com
  Password: ""

BinlogReader:
  Addr: 127.0.0.1:3306
  User: canal
  Password: ""
  TableDB: gochat

Kafka:
  BootstrapServers: 127.0.0.1:9092
  Acks: 1
  GroupID: gochat
  AutoOffsetReset: latest

Breaker:
  MaxRequests: 5
  Interval: 60s
  Timeout: 30s
  BucketPeriod: 1m
  ErrorRate: 0.50
  ErrorThreshold: 20

OTEL:
  Endpoint: 127.0.0.1:4317
  ServiceName: gochat
  Environment: debug
  Insecure: true
