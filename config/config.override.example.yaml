# Example deploy override (gitignored as config.override.yaml). Use for cluster-specific tweaks.
# Only include keys you want to override. Overlays expand env vars so you can inject secrets at runtime.
Env: production
DisableSessionStartedEvent: false

PProf:
  Enabled: true
  Host: 127.0.0.1
  Port: 6060

Logger:
  Level: warn

Cookie:
  Secure: true
  Domain: example.com

CORS:
  AllowOrigins:
    - https://app.example.com

Kafka:
  BootstrapServers: kafka:9092

OTEL:
  Enabled: true
  Endpoint: otel-collector:4317
  TraceSampleRatio: 0.10
  MetricExportInterval: 30s
  MetricExportTimeout: 10s

# Sensitive values: set via env in overrides
AccessToken:
  Secret: ${JWT_SECRET}
Mysql:
  Username: gochat_app
  Password: ${DB_PASSWORD}
  MaxOpenConns: 200
  MaxIdleConns: 100
  ConnMaxLifetimeSec: 600
  ConnMaxIdleTimeSec: 120
Redis:
  User: gochat_app
  Password: ${REDIS_PASSWORD}
Email:
  Password: ${EMAIL_PASSWORD}
BinlogReader:
  Password: ${BINLOG_PASSWORD}
