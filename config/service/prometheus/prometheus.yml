  # Prometheus configuration for GoChat
# Global settings
global:
  scrape_interval: 15s       # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules (none yet)
  scrape_timeout: 10s

# Alerting & rule files placeholders (future)
# rule_files:
#   - /etc/prometheus/rules/*.yml
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: []  # add alertmanager:9093 later

scrape_configs:
  # Scrape the GoChat application. /metrics will be added later.
  - job_name: 'gochat-app'
    honor_labels: true
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8888  # Compose service name + port
        labels:
          app: gochat
          tier: backend
    relabel_configs:
      # Set a stable instance label
      - source_labels: [__address__]
        regex: '(.+)'
        target_label: instance
        replacement: gochat-backend

