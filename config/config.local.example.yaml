# Example local overrides (gitignored as config.local.yaml). Copy this file and adjust.
# Base config already provides full defaults; include only keys you need to change.
Port: 8081
Env: local
DisableSessionStartedEvent: false

Mysql:
  Host: 127.0.0.1
  Port: 3306
  Username: root
  Password: ${DB_PASSWORD}
  Database: gochat_local
  MaxOpenConns: 120
  MaxIdleConns: 60
  ConnMaxLifetimeSec: 600
  ConnMaxIdleTimeSec: 120

Redis:
  Database: 1
  Password: ${REDIS_PASSWORD}

Logger:
  Level: debug

CORS:
  AllowOrigins:
    - http://localhost:3000

AccessToken:
  Secret: ${JWT_SECRET}

Email:
  Password: ${EMAIL_PASSWORD}

BinlogReader:
  Password: ${BINLOG_PASSWORD}
