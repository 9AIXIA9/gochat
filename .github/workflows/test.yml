# .github/workflows/test.yml
name: Run Tests
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Go version
        run: go version

      - name: Tidy modules
        run: go mod tidy

      - name: Download deps
        run: go mod download

      - name: Prepare coverage directory
        run: mkdir -p coverage

      - name: Run tests with coverage
        run: go test ./... -cover -coverprofile=coverage/coverage.out -count=1 -race

      - name: Coverage summary
        run: go tool cover -func=coverage/coverage.out | tee coverage/coverage.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/coverage.out
            coverage/coverage.txt
