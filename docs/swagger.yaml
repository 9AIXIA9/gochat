  /rooms/requests/:
    get:
      description: 获取当前登录用户管理的房间成员请求列表，可基于 base_id 游标和 limit 分页
      parameters:
      - description: 分页游标，返回该ID之前的记录
        enum:
        - ""
        in: query
        name: base_id
        type: string
      - description: 分页大小，默认20，最大100
