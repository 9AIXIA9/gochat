basePath: /api/v1
definitions:
  gochat_internal_chat_domain.MessageState:
    enum:
    - undelivered
    - delivered
    - read
    type: string
    x-enum-varnames:
    - MessageStateUndelivered
    - MessageStateDelivered
    - MessageStateRead
  gochat_internal_chat_dto.PrivateMessage:
    properties:
      content:
        type: string
      id:
        $ref: '#/definitions/gochat_internal_shared_kernel.MessageID'
      recipient_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
      sender_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
      sent_at:
        type: string
      state:
        $ref: '#/definitions/gochat_internal_chat_domain.MessageState'
    type: object
  gochat_internal_chat_dto.RoomMessage:
    properties:
      content:
        type: string
      id:
        $ref: '#/definitions/gochat_internal_shared_kernel.MessageID'
      room_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.RoomID'
      sender_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
      sent_at:
        type: string
      states:
        additionalProperties:
          $ref: '#/definitions/gochat_internal_chat_domain.MessageState'
        type: object
    type: object
  gochat_internal_friendship_domain.FriendRequestState:
    enum:
    - pending
    - agreed
    - refused
    type: string
    x-enum-varnames:
    - StatePending
    - StateAgreed
    - StateRefused
  gochat_internal_friendship_domain.FriendshipID:
    enum:
    - ""
    type: string
    x-enum-varnames:
    - EmptyUserID
  gochat_internal_friendship_dto.FriendRequest:
    properties:
      content:
        type: string
      from:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
      id:
        $ref: '#/definitions/gochat_internal_shared_kernel.OperationID'
      sent_at:
        description: UTC
        type: string
      state:
        $ref: '#/definitions/gochat_internal_friendship_domain.FriendRequestState'
      to:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
    type: object
  gochat_internal_friendship_dto.Friendship:
    properties:
      created_at:
        type: string
      id:
        $ref: '#/definitions/gochat_internal_friendship_domain.FriendshipID'
      user_id_1:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
      user_id_2:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
    type: object
  gochat_internal_notification_domain.MessageState:
    enum:
    - undelivered
    - delivered
    type: string
    x-enum-varnames:
    - MessageStateUndelivered
    - MessageStateDelivered
  gochat_internal_notification_dto.SystemMessage:
    properties:
      content:
        type: string
      id:
        $ref: '#/definitions/gochat_internal_shared_kernel.MessageID'
      recipient_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
      sent_at:
        type: string
      state:
        $ref: '#/definitions/gochat_internal_notification_domain.MessageState'
    type: object
  gochat_internal_profile_dto.RoomProfile:
    properties:
      created_at:
        type: string
      id:
        $ref: '#/definitions/gochat_internal_shared_kernel.RoomID'
      introduction:
        type: string
      name:
        type: string
    type: object
  gochat_internal_profile_dto.UserProfile:
    properties:
      address:
        type: string
      email:
        type: string
      gender:
        $ref: '#/definitions/gochat_internal_shared_kernel.Gender'
      id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
      name:
        type: string
      phone_number:
        type: string
      sign:
        type: string
      signed_up_at:
        type: string
    type: object
  gochat_internal_roomship_domain.MemberRequestState:
    enum:
    - pending
    - agreed
    - refused
    type: string
    x-enum-varnames:
    - StatePending
    - StateAgreed
    - StateRefused
  gochat_internal_roomship_domain.RoomshipID:
    enum:
    - ""
    type: string
    x-enum-varnames:
    - EmptyUserID
  gochat_internal_roomship_domain.RoomshipRole:
    enum:
    - owner
    - member
    type: string
    x-enum-varnames:
    - OwnerRole
    - MemberRole
  gochat_internal_roomship_dto.MemberRequest:
    properties:
      applicant_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
      content:
        type: string
      created_at:
        type: string
      id:
        $ref: '#/definitions/gochat_internal_shared_kernel.OperationID'
      operated_at:
        type: string
      operator_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
      room_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.RoomID'
      state:
        $ref: '#/definitions/gochat_internal_roomship_domain.MemberRequestState'
    type: object
  gochat_internal_roomship_dto.Roomship:
    properties:
      created_at:
        type: string
      id:
        $ref: '#/definitions/gochat_internal_roomship_domain.RoomshipID'
      role:
        $ref: '#/definitions/gochat_internal_roomship_domain.RoomshipRole'
      room_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.RoomID'
      user_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
    type: object
  gochat_internal_shared_api.Code:
    enum:
    - 200
    - 300
    - 500
    - 403
    - 404
    - 405
    - 406
    - 407
    type: integer
    x-enum-varnames:
    - CodeSuccess
    - CodeBusinessError
    - CodeServerError
    - CodeTimeout
    - CodeInvalidParam
    - CodeUnauthorized
    - CodeNotFound
    - CodeServiceUnavailable
  gochat_internal_shared_api.Response:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/gochat_internal_shared_api.Code'
        example: 200
      data:
        type: object
      message:
        example: Success
        type: string
    type: object
  gochat_internal_shared_kernel.Gender:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - UnknownGender
    - MaleGender
    - FemaleGender
  gochat_internal_shared_kernel.MessageID:
    enum:
    - ""
    type: string
    x-enum-varnames:
    - EmptyUserID
  gochat_internal_shared_kernel.OperationID:
    enum:
    - ""
    type: string
    x-enum-varnames:
    - EmptyUserID
  gochat_internal_shared_kernel.RoomID:
    enum:
    - ""
    type: string
    x-enum-varnames:
    - EmptyUserID
  gochat_internal_shared_kernel.UserID:
    enum:
    - ""
    type: string
    x-enum-varnames:
    - EmptyUserID
  internal_authorization_port_http.LoginRequest:
    properties:
      number:
        example: "2004426295315795968"
        type: string
      password:
        example: your-password
        type: string
    required:
    - number
    - password
    type: object
  internal_authorization_port_http.LoginResponseData:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJVc2VySUQiOiIwMTliNTkyOS02NWJjLTc1NDktODljNi0zZjdkYzY4NzI1NzciLCJleHAiOjE3NjY4MjY5MTMsImlhdCI6MTc2NjgyMzMxM30.ogmbXIK85Eqnh3EP_8Ttj0kkuZxsxP5wfERPSc0vNgw
        type: string
    type: object
  internal_authorization_port_http.RefreshAccessTokenResponseData:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJVc2VySUQiOiIwMTliNTkyOS02NWJjLTc1NDktODljNi0zZjdkYzY4NzI1NzciLCJleHAiOjE3NjY4MjY5MTMsImlhdCI6MTc2NjgyMzMxM30.ogmbXIK85Eqnh3EP_8Ttj0kkuZxsxP5wfERPSc0vNgw
        type: string
    type: object
  internal_authorization_port_http.SignUpRequest:
    properties:
      email:
        example: youremail@demo.com
        type: string
      password:
        example: your-password
        maxLength: 50
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  internal_authorization_port_http.SignUpResponseData:
    properties:
      user_number:
        example: "2004426295315795968"
        type: string
    type: object
  internal_chat_port_http.ListPrivateMessagesResponseData:
    properties:
      private_messages:
        items:
          $ref: '#/definitions/gochat_internal_chat_dto.PrivateMessage'
        type: array
    type: object
  internal_chat_port_http.ListRoomMessagesResponseData:
    properties:
      room_messages:
        items:
          $ref: '#/definitions/gochat_internal_chat_dto.RoomMessage'
        type: array
    type: object
  internal_chat_port_http.ReadPrivateMessagesRequest:
    properties:
      sender_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
    required:
    - sender_id
    type: object
  internal_chat_port_http.ReadRoomMessagesRequest:
    properties:
      room_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.RoomID'
    required:
    - room_id
    type: object
  internal_chat_port_http.SendPrivateMessageRequest:
    properties:
      content:
        maxLength: 1000
        type: string
      recipient_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
    required:
    - content
    - recipient_id
    type: object
  internal_chat_port_http.SendRoomMessageRequest:
    properties:
      content:
        maxLength: 1000
        type: string
      room_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.RoomID'
    required:
    - content
    - room_id
    type: object
  internal_friendship_port_http.ListFriendRequestsResponseData:
    properties:
      requests:
        items:
          $ref: '#/definitions/gochat_internal_friendship_dto.FriendRequest'
        type: array
    type: object
  internal_friendship_port_http.ListFriendshipsResponseData:
    properties:
      friendships:
        items:
          $ref: '#/definitions/gochat_internal_friendship_dto.Friendship'
        type: array
    type: object
  internal_friendship_port_http.SendFriendRequestRequest:
    properties:
      content:
        maxLength: 100
        type: string
      to_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.UserID'
    required:
    - content
    - to_id
    type: object
  internal_notification_port_http.ListSystemMessagesResponseData:
    properties:
      system_messages:
        items:
          $ref: '#/definitions/gochat_internal_notification_dto.SystemMessage'
        type: array
    type: object
  internal_profile_port_http.GetMyProfileResponseData:
    properties:
      profile:
        $ref: '#/definitions/gochat_internal_profile_dto.UserProfile'
    type: object
  internal_profile_port_http.GetRoomProfileResponseData:
    properties:
      profile:
        $ref: '#/definitions/gochat_internal_profile_dto.RoomProfile'
    type: object
  internal_profile_port_http.GetUserProfileResponseData:
    properties:
      profile:
        $ref: '#/definitions/gochat_internal_profile_dto.UserProfile'
    type: object
  internal_profile_port_http.UpdateRoomProfileRequest:
    properties:
      introduction:
        type: string
      name:
        type: string
      roomID:
        $ref: '#/definitions/gochat_internal_shared_kernel.RoomID'
    required:
    - roomID
    type: object
  internal_profile_port_http.UpdateUserProfileRequest:
    properties:
      address:
        type: string
      email:
        type: string
      gender:
        $ref: '#/definitions/gochat_internal_shared_kernel.Gender'
      name:
        type: string
      phone_number:
        type: string
      sign:
        type: string
    type: object
  internal_roomship_port_http.CreateRoomRequest:
    properties:
      max_member_count:
        maximum: 200
        minimum: 0
        type: integer
      password:
        maxLength: 100
        type: string
    type: object
  internal_roomship_port_http.ListMemberRequestsResponseData:
    properties:
      requests:
        items:
          $ref: '#/definitions/gochat_internal_roomship_dto.MemberRequest'
        type: array
    type: object
  internal_roomship_port_http.ListRoomMembersResponseData:
    properties:
      roomships:
        items:
          $ref: '#/definitions/gochat_internal_roomship_dto.Roomship'
        type: array
    type: object
  internal_roomship_port_http.ListRoomshipsResponseData:
    properties:
      roomships:
        items:
          $ref: '#/definitions/gochat_internal_roomship_dto.Roomship'
        type: array
    type: object
  internal_roomship_port_http.SendMemberRequestRequest:
    properties:
      content:
        maxLength: 100
        type: string
      password:
        maxLength: 100
        type: string
      room_id:
        $ref: '#/definitions/gochat_internal_shared_kernel.RoomID'
    required:
    - room_id
    type: object
host: localhost:8080
info:
  contact:
    email: 906094554@qq.com
    name: XIA
  description: GoChat 聊天/好友/房间管理后端接口
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: GoChat Backend API
  version: "1.0"
paths:
  /auth/login:
    post:
      description: 使用账号和密码登录，成功后下发访问令牌与刷新令牌（刷新令牌存于 Cookie）
      parameters:
      - description: 登录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_authorization_port_http.LoginRequest'
      responses:
        "200":
          description: 登录成功，返回访问令牌
          schema:
            allOf:
            - $ref: '#/definitions/gochat_internal_shared_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_authorization_port_http.LoginResponseData'
              type: object
      summary: 用户登录
      tags:
      - Authorization
  /auth/sign-up:
    post:
      description: 使用邮箱和密码注册账号，成功后返回系统分配的账号
      parameters:
      - description: 注册请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_authorization_port_http.SignUpRequest'
      responses:
        "200":
          description: 注册成功，返回账号
          schema:
            allOf:
            - $ref: '#/definitions/gochat_internal_shared_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_authorization_port_http.SignUpResponseData'
              type: object
      summary: 用户注册
      tags:
      - Authorization
  /auth/tokens/refresh:
    put:
      description: 使用刷新令牌 Cookie 刷新访问令牌，并重新设置刷新令牌 Cookie
      responses:
        "200":
          description: 刷新成功，返回新的访问令牌
          schema:
            allOf:
            - $ref: '#/definitions/gochat_internal_shared_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_authorization_port_http.RefreshAccessTokenResponseData'
              type: object
      summary: 刷新访问令牌
      tags:
      - Authorization
  /chats/private-messages:
    post:
      description: 向指定用户发送一条私聊消息
      parameters:
      - description: 发送私聊消息请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_chat_port_http.SendPrivateMessageRequest'
      responses:
        "200":
          description: 发送成功
          schema:
            $ref: '#/definitions/gochat_internal_shared_api.Response'
      security:
      - BearerAuth: []
      summary: 发送私聊消息
      tags:
      - Chat
  /chats/private-messages/{user_id}:
    get:
      description: 获取用户和对方聊天记录，可基于 base_id 游标和 limit 分页
      parameters:
      - description: 私聊对象用户ID
        enum:
        - ""
        in: path
        name: user_id
        required: true
        type: string
      - description: 分页游标，返回该ID之前的消息
        enum:
        - ""
        in: query
        name: base_id
        type: string
      - description: 分页大小，默认20，最大100
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: 成功返回私聊消息记录
          schema:
            allOf:
            - $ref: '#/definitions/gochat_internal_shared_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_chat_port_http.ListPrivateMessagesResponseData'
              type: object
      security:
      - BearerAuth: []
      summary: 获取用户聊天记录
      tags:
      - Chat
  /chats/private-messages/read:
    put:
      description: 向指定房间发送一条消息
      parameters:
      - description: 发送房间消息请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_chat_port_http.ReadPrivateMessagesRequest'
      responses:
        "200":
          description: 发送成功
          schema:
            $ref: '#/definitions/gochat_internal_shared_api.Response'
      security:
      - BearerAuth: []
      summary: 发送房间消息
      tags:
      - Chat
  /chats/rooms/messages:
    get:
      description: 获取当前登录用户所在房间的消息记录，可基于 base_id 游标和 limit 分页
      parameters:
      - description: 房间ID
        enum:
        - ""
        in: path
        name: room_id
        required: true
        type: string
      - description: 分页游标，返回该ID之前的消息
        enum:
        - ""
        in: query
        name: base_id
        type: string
      - description: 分页大小，默认20，最大100
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: 成功返回房间消息记录
          schema:
            allOf:
            - $ref: '#/definitions/gochat_internal_shared_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_chat_port_http.ListRoomMessagesResponseData'
              type: object
      security:
      - BearerAuth: []
      summary: 获取房间内的消息
      tags:
      - Chat
    post:
      description: 向指定房间发送一条消息
      parameters:
      - description: 发送房间消息请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_chat_port_http.SendRoomMessageRequest'
      responses:
        "200":
          description: 发送成功
          schema:
            $ref: '#/definitions/gochat_internal_shared_api.Response'
      security:
      - BearerAuth: []
      summary: 发送房间消息
      tags:
      - Chat
  /chats/rooms/messages/read:
    put:
      description: 向指定房间发送一条消息
      parameters:
      - description: 发送房间消息请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_chat_port_http.ReadRoomMessagesRequest'
      responses:
        "200":
          description: 发送成功
          schema:
            $ref: '#/definitions/gochat_internal_shared_api.Response'
      security:
      - BearerAuth: []
      summary: 发送房间消息
      tags:
      - Chat
  /friendship-requests/:
    get:
      description: 获取当前登录用户相关的好友请求列表，可基于 base_id 游标和 limit 分页
      parameters:
      - description: 分页游标，返回该ID之前的记录
        enum:
        - ""
        in: query
        name: base_id
        type: string
      - description: 分页大小，默认20，最大100
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: 成功返回好友请求列表
          schema:
            allOf:
            - $ref: '#/definitions/gochat_internal_shared_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_friendship_port_http.ListFriendRequestsResponseData'
              type: object
      security:
      - BearerAuth: []
      summary: 获取好友请求列表
      tags:
      - Friendship
    post:
      description: 向指定用户发送好友请求
      parameters:
      - description: 发送好友请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_friendship_port_http.SendFriendRequestRequest'
      responses:
        "200":
          description: 发送成功
          schema:
            $ref: '#/definitions/gochat_internal_shared_api.Response'
      security:
      - BearerAuth: []
      summary: 发送好友请求
      tags:
      - Friendship
  /friendship-requests/{request_id}/agree:
    put:
      description: 同意指定的好友请求，将对方加入好友列表
      parameters:
      - description: 好友请求ID
        enum:
        - ""
        in: path
        name: request_id
        required: true
        type: string
      responses:
        "200":
          description: 同意成功
          schema:
            $ref: '#/definitions/gochat_internal_shared_api.Response'
      security:
      - BearerAuth: []
      summary: 同意好友请求
      tags:
      - Friendship
  /friendship-requests/{request_id}/refuse:
    put:
      description: 拒绝指定的好友请求
      parameters:
      - description: 好友请求ID
        enum:
        - ""
        in: path
        name: request_id
        required: true
        type: string
      responses:
        "200":
          description: 拒绝成功
          schema:
            $ref: '#/definitions/gochat_internal_shared_api.Response'
      security:
      - BearerAuth: []
      summary: 拒绝好友请求
      tags:
      - Friendship
  /friendships/:
    get:
      description: 获取当前登录用户的好友关系列表，可基于 base_id 游标和 limit 分页
      parameters:
      - description: 分页游标，返回该ID之前的记录
        enum:
        - ""
        in: query
        name: base_id
        type: string
      - description: 分页大小，默认20，最大100
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: 成功返回好友列表
          schema:
            allOf:
            - $ref: '#/definitions/gochat_internal_shared_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_friendship_port_http.ListFriendshipsResponseData'
              type: object
      security:
      - BearerAuth: []
      summary: 获取好友列表
      tags:
      - Friendship
  /notifications/system-messages:
    get:
      description: 获取当前登录用户的系统通知列表，可基于 base_id 游标和 limit 分页
      parameters:
      - description: 分页游标，返回该ID之前的消息
        enum:
        - ""
        in: query
        name: base_id
        type: string
      - description: 分页大小，默认20，最大100
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: 成功返回系统通知列表
