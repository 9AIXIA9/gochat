Name: gochat
Host: 0.0.0.0
Port: 8888
Language: "zh"

JWT:
  Secret: "${JWT_SECRET}"  
  ExpireTime: 24 # hours

Database:
  Host: localhost
  Port: 3306
  Username: root
  Password: "${DB_PASSWORD}"  
  Database: gochat

Redis:
  Host: localhost
  Port: 16379
  Password: "${REDIS_PASSWORD}"  
  DB: 0

Log:
  Mode: debug
  Level: info
  Filename: logs/app.log
  MaxSize: 100 # MB
  MaxAge: 7 # days
  MaxBackups: 3

Snowflake:
  Node: 1
