Name: gochat
Host: 0.0.0.0
Port: 8888
Language: "zh"
Timeout: 5s

Cert:
  HTTPSKeyFile: ${HTTPS_KEY_FILE}
  HTTPSCertFIle: ${HTTPS_CERT_FILE}

Cookie:
  Domain: ${COOKIE_DOMAIN}
  Secure: ${COOKIE_SECURE}
  HttpOnly: ${COOKIE_HTTPONLY}
  Path: ${COOKIE_PATH}

CORS:
  Origins: ${CORS_ORIGINS}
  AllowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  AllowHeaders:
    - Origin
    - Content-Type
    - Authorization
  ExposeHeaders:
    - Content-Length
    - Content-Type
  AllowCredentials: true
  MaxAge: 72h

Token:
  Refresh:
    Length: 32
    ExpireDuration: 72h
  Auth:
    Secret: ${JWT_SECRET}
    ExpireDuration: 1h

RateLimit:
  Period: 1s
  Limit: 10

Database:
  Host: localhost
  Port: 13306
  Username: root
  Password: ${DB_PASSWORD}
  Database: gochat

Redis:
  Host: localhost
  Port: 16379
  Password: ${REDIS_PASSWORD}
  DB: 0

Log:
  Mode: debug
  Level: info
  Filename: logs/app.log
  MaxSize: 100    # MB
  MaxAge: 7       # days
  MaxBackups: 3

Snowflake:
  Node: 1

Encryptor:
  Cost: 10

