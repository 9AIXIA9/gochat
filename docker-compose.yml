services:
  mysql:
    image: mysql:8.4
    hostname: mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gochat}
      MYSQL_USER: gochat_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      BINLOG_USER: binlog
      BINLOG_PASSWORD: ${BINLOG_PASSWORD:-password}
    command: [
      "mysqld",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--binlog-format=ROW",
      "--server-id=1",
      "--gtid-mode=ON",
      "--enforce-gtid-consistency=ON",
      "--log-bin=mysql-bin",
      "--binlog-row-image=FULL",
      "--binlog-expire-logs-seconds=604800",
      "--binlog_row_metadata=MINIMAL"
    ]
    ports:
      - '${MYSQL_HOST_PORT:-13306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deployment/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    hostname: redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_ADMIN_USER: admin
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:-admin}
      REDIS_USER: gochat_app
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    command: [ "sh", "-ec", "/scripts/init_redis.sh" ]
    ports:
      - '${REDIS_HOST_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
      - ./deployment/redis_init/init_redis.sh:/scripts/init_redis.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning --user \"$${REDIS_ADMIN_USER}\" --pass \"$${REDIS_ADMIN_PASSWORD}\" ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - '${KAFKA_PORT:-9092}:9092'
      - '19092:19092'
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.2.0
    hostname: kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-1}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TOPICS_FILE: /scripts/topics.txt
    volumes:
      - ./deployment/kafka-init:/scripts:ro
    command: [ "sh", "/scripts/init_topics.sh" ]

  migrate:
    hostname: migrate
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: gochat_app
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${MYSQL_DATABASE:-gochat}
      GOOSE_MIGRATIONS_DIR: /app/db/migrations
    volumes:
      - ./db/migrations:/app/db/migrations:ro
      - ./deployment/migrate/run_migrations.sh:/scripts/run_migrations.sh:ro
    command: [ "/bin/sh", "/scripts/run_migrations.sh" ]

  #  OpenTelemetry Collector - 遥测数据收集器
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    hostname: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # 内部指标端口
      - "8889:8889"  # Prometheus metrics endpoint
    volumes:
      - ./deployment/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - jaeger
      - prometheus

  # Jaeger - 分布式追踪
  jaeger:
    image: jaegertracing/all-in-one:1.57
    hostname: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: "info"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # model.proto
      - "14268:14268"  # HTTP接收
      - "9411:9411"    # Zipkin兼容端点
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:14269" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Prometheus - 指标存储
  prometheus:
    image: prom/prometheus:v2.54.1
    hostname: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Grafana - 数据可视化
  grafana:
    image: grafana/grafana:11.2.0
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployment/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deployment/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    hostname: app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '${APP_HOST_PORT:-8080}:8080'
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./config/config.override.yaml:/app/config/config.override.yaml:ro
    command: [ "/app/server", "-config", "./config/config.yaml","-override_config","./config/config.override.yaml" ]

volumes:
  mysql-data:
    driver: local
    name: gochat-mysql-data
  redis-data:
    driver: local
    name: gochat-redis-data
  kafka-data:
    name: gochat-kafka-data
    driver: local
  prometheus-data:
    name: gochat-prometheus-data
  grafana-data:
    name: gochat-grafana-data