services:
  mysql:
    image: mysql:8.0.40
    hostname: mysql
    container_name: gochat-mysql
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # MySQL 容器内部环境变量
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gochat
      MYSQL_USER: gochat_app
      MYSQL_PASSWORD: gochat
      # 初始化脚本使用的变量
      BINLOG_USER: binlog
      BINLOG_PASSWORD: binlog
    command: [
      "mysqld",
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--binlog-format=ROW",
      "--server-id=1",
      "--gtid-mode=ON",
      "--enforce-gtid-consistency=ON",
      "--log-bin=mysql-bin",
      "--binlog-row-image=FULL",
      "--binlog_expire_logs_seconds=604800",  # 7天
      "--binlog_row_metadata=MINIMAL"  #减少 Binlog大小
    ]
    ports:
      - '${MYSQL_HOST_PORT:-13306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      # Ensure first-time initialization runs our user/grant setup
      - ./deployment/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 使用应用用户进行健康检查，避免使用 root
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$MYSQL_USER -p$MYSQL_PASSWORD || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.0-alpine
    container_name: gochat-redis
    hostname: redis
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_ROOT_PASSWORD: root
      REDIS_USER: gochat_app
      REDIS_PASSWORD: gochat
    # 使用 ACL 文件定义用户/权限
    command: [ "sh", "-lc", "exec redis-server --appendonly yes --aclfile /etc/redis/users.acl" ]
    ports:
      - '${REDIS_HOST_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
      - ./deployment/redis_init/init_users.acl:/etc/redis/users.acl:ro
    healthcheck:
      # 默认用户仅允许 ping/info 密码来自环境中
      test: [ "CMD-SHELL", "redis-cli -a \"$REDIS_ROOT_PASSWORD\" ping || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka-native:4.1.0
    container_name: gochat-kafka
    hostname: kafka
    ports:
      - '9092:9092'  # 外部访问端口
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 && nc -z localhost 29093 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    container_name: gochat-backend
    hostname: app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - config/service/.env.app
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '${APP_HOST_PORT:-8888}:8888'
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    command: [ "/app/server", "-config", "./config/config.yaml" ]


volumes:
  mysql-data:
    driver: local
    name: gochat-mysql-data
  redis-data:
    driver: local
    name: gochat-redis-data
  kafka-data:
    name: gochat-kafka-data
    driver: local