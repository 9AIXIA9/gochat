version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gochat-api
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./etc:/app/etc
    depends_on:
      - mysql
      - redis
    networks:
      - gochat-network

  mysql:
    image: mysql:8.0
    container_name: gochat-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=gochat_secret
      - MYSQL_DATABASE=gochat
      - MYSQL_USER=gochat
      - MYSQL_PASSWORD=gochat_pass
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - gochat-network

  redis:
    image: redis:7-alpine
    container_name: gochat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gochat-network

networks:
  gochat-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
