services:
  mysql:
    image: mysql:8.4
    hostname: mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gochat}
      MYSQL_USER: gochat_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      BINLOG_USER: binlog
      BINLOG_PASSWORD: ${BINLOG_PASSWORD:-password}
    command: [
      "mysqld",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--binlog-format=ROW",
      "--server-id=1",
      "--gtid-mode=ON",
      "--enforce-gtid-consistency=ON",
      "--log-bin=mysql-bin",
      "--binlog-row-image=FULL",
      "--binlog-expire-logs-seconds=604800",
      "--binlog_row_metadata=MINIMAL"
    ]
    ports:
      - '${MYSQL_HOST_PORT:-13306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deployment/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    hostname: redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_ADMIN_USER: admin
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:-admin}
      REDIS_USER: gochat_app
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    command: [ "sh", "-ec", "/scripts/init_redis.sh" ]
    ports:
      - '${REDIS_HOST_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
      - ./deployment/redis_init/init_redis.sh:/scripts/init_redis.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning --user \"$${REDIS_ADMIN_USER}\" --pass \"$${REDIS_ADMIN_PASSWORD}\" ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - '${KAFKA_PORT:-9092}:9092'
      - '19092:19092'
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.2.0
    hostname: kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-1}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TOPICS_FILE: /scripts/topics.txt
    volumes:
      - ./deployment/kafka-init:/scripts:ro
    command: [ "sh", "/scripts/init_topics.sh" ]

  migrate:
    hostname: migrate
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: gochat_app
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${MYSQL_DATABASE:-gochat}
      GOOSE_MIGRATIONS_DIR: /app/db/migrations
    volumes:
      - ./db/migrations:/app/db/migrations:ro
      - ./deployment/migrate/run_migrations.sh:/scripts/run_migrations.sh:ro
    command: [ "/bin/sh", "/scripts/run_migrations.sh" ]

  app:
    hostname: app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '${APP_HOST_PORT:-8080}:8080'
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./config/config.override.yaml:/app/config/config.override.yaml:ro
    command: [ "/app/server", "-config", "./config/config.yaml","-override_config","./config/config.override.yaml" ]

volumes:
  mysql-data:
    driver: local
    name: gochat-mysql-data
  redis-data:
    driver: local
    name: gochat-redis-data
  kafka-data:
    name: gochat-kafka-data
    driver: local
