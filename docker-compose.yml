version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudclip-api
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./etc:/app/etc
    depends_on:
      - mysql
      - redis
    networks:
      - cloudclip-network

  mysql:
    image: mysql:8.0
    container_name: cloudclip-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=cloudclip_secret
      - MYSQL_DATABASE=cloudclip
      - MYSQL_USER=cloudclip
      - MYSQL_PASSWORD=cloudclip_pass
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - cloudclip-network

  redis:
    image: redis:7-alpine
    container_name: cloudclip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cloudclip-network

networks:
  cloudclip-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
